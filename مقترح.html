<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal Form</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#eef0f4; margin:0; padding:24px; }
  .tip { font-size:0.8rem; color:#666; margin-bottom:0.6rem; max-width:210mm; margin-inline:auto }
  .a4-page { width:210mm; min-height:297mm; margin:0 auto 22px; background:#fff; padding:14mm; box-sizing:border-box; box-shadow:0 2px 14px rgba(0,0,0,0.18); }
  .page-break { break-before:page; }
  @media print {
    @page { size:A4; margin:0; }
    body { background:#fff; padding:0 }
    .a4-page { width:auto; min-height:auto; margin:0; padding:14mm; box-shadow:none; break-after:page }
    .page-break { break-before:page; page-break-before:always }
    .toolbar, .tip { display:none!important; }
  }
  .toolbar { max-width:920px; margin:0 auto 1rem; display:flex; gap:0.5rem; flex-wrap:wrap }
  .toolbar button { display:flex; align-items:center; gap:6px; padding:0.5rem 1rem; border-radius:8px; border:1px solid #cbd5e1; background:#fff; color:#111; font-size:0.85rem; font-weight:700; cursor:pointer; font-family:inherit }
  .toolbar button:hover { border-color:#94a3b8 }
  .toolbar button.primary { background:#2563eb; border-color:#2563eb; color:#fff }
  #_toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:0.6rem 1.1rem; border-radius:8px; font-size:0.85rem; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9999 }
  #_toast.show { opacity:1 }
  #_toast.err { background:#b91c1c }
</style>
</head>
<body>

<div class="toolbar" id="_localToolbar">
  <button type="button" onclick="window.print()">🖨️ Print</button>
  <button type="button" onclick="_exportWord()">📄 Export Word</button>
  <button type="button" class="primary" onclick="_saveProposal()">💾 Save</button>
</div>
<script>if (window !== window.top) document.write('<style>#_localToolbar{display:none}</style>');</script>

<div class="tip">💡 Click any value cell to copy it, then paste it wherever you need.</div>

<div id="roundSelWrap" style="max-width:920px;margin:0 auto"></div>
<div id="proposalForm" style="max-width:920px;margin:0 auto 1.5rem"></div>
<div id="_toast"></div>

<script>
  // ── Style tokens (match the original report look) ──────────────────
  const S = {
    hdr:  'background:#e8333a;color:#fff;font-weight:800;padding:8px 12px;font-size:13px;margin-top:14px;border-radius:3px',
    tbl:  'width:100%;border-collapse:separate;border-spacing:4px;margin-top:4px',
    lbl:  'background:#efefef;color:#111;font-weight:700;font-size:11.5px;padding:9px 10px;width:1%',
    val:  'background:#e7ecf7;color:#111;padding:9px 10px;font-size:11.5px;cursor:pointer',
    colh: 'background:#efefef;color:#111;font-weight:700;text-align:center;font-size:11px;padding:7px',
    cval: 'background:#e7ecf7;color:#111;text-align:center;padding:9px;font-size:11.5px;cursor:pointer;min-width:42px',
    grp:  'background:#efefef;color:#111;font-weight:700;text-align:center;font-size:11.5px;padding:7px',
  };

  const tip  = 'click to copy';
  const RECS = [
    'According to the details above there are 2 options, the best option is option No.1 that will solve the issue',
    'According to the details above there are 2 options, the best option is option No.2 that will solve the issue'
  ];
  // خيارات "Project Description" الجاهزة (قائمة منسدلة بدل الكتابة اليدوية)
  const PROJ_DESCS = [
    'Add New LT FD to share the load with exiting FD due to overload',
    'Add New TX with LT FD due to voltage drop',
    'Upgrade TX. from 100 KVA To 200 KVA',
    'Upgrade TX. from 100 KVA To 315 KVA',
    'Upgrade TX. from 200 KVA To 315 KVA',
    'Upgrade TX. from 315 KVA To 500 KVA',
    'Upgrade TX. from 315 KVA To 1000 KVA',
    'Upgrade TX. from 500 KVA To 1000 KVA'
  ];
  const lbl  = (x, extra)  => `<td style="${S.lbl}${extra ? ';'+extra : ''}">${x}</td>`;
  const colh = x        => `<td style="${S.colh}">${x}</td>`;
  // contenteditable="true" so the cell can be filled in directly on this standalone page
  const val  = (x, cs, key)  => `<td style="${S.val}"${cs ? ` colspan="${cs}"` : ''}${key ? ` data-key="${key}"` : ''} contenteditable="true" onclick="_copyCell(this)" title="${tip}">${x || ''}</td>`;
  const cval = (x, key)      => `<td style="${S.cval}"${key ? ` data-key="${key}"` : ''} contenteditable="true" onclick="_copyCell(this)" title="${tip}">${x || ''}</td>`;

  // ── Fill this object with your data (or leave blank / edit inline) ─
  const d = {
    refNo:'', projDesc:'', station: '', district:'Dhahira', reqDept:'Operation',   // Area = station
    txNo: '', cap: '', complaints:'', lat: null, lng: null,
    vRN:'', vYN:'', vBN:'', vRY:'', vRB:'', vYB:'',
    tR:'', tY:'', tB:'', tN:'', txPct:'',
    fR:'', fY:'', fB:'', fN:'', fPct:'', fNum:'', fAmp:'', fSize:'',
    cableSize:'', connPoint:'',
    opt1:'', opt1Cost:'', opt2:'', opt2Cost:'',
    reason:'', risk:'', gisImage:null,
    freeSpare:'', assetTypes:['Transformer'], assetUnit:'',
    recommendation:'',
    engName:'', engDate:'', secName:'', secDate:'', mgrName:'', mgrDate:'',
    engSig:null, secSig:null, mgrSig:null
  };

  // ── Prefill from URL query params (e.g. ?station=...&txNo=...&cap=...&txPct=...) ─
  const _qs = new URLSearchParams(location.search);
  ['station','txNo','cap','txPct','fPct','fNum'].forEach(k => {
    const v = _qs.get(k);
    if (v) d[k] = v;
  });

  // ── Prefill from the app (sessionStorage payload: station/txNo/cap + per-round readings) ─
  let _payload = null;
  try {
    const raw = sessionStorage.getItem('proposalData');
    if (raw) _payload = JSON.parse(raw);
  } catch (e) {}

  function _pct(cap, cur) {
    const rated = cap ? (Number(cap) * 1000) / (Math.sqrt(3) * 415) : 0;
    if (!rated || !cur) return '';
    return String(Math.round((Number(cur) / rated) * 100));
  }

  // نسبة حمل الفيدر = أعلى تيار ÷ قدرة تحمّل الكيبل (ampacity) — وليس قدرة المحول
  function _pctCable(amp, cur) {
    const a = Number(amp) || 0;
    if (!a || !cur) return '';
    return String(Math.round((Number(cur) / a) * 100));
  }

  function dateCell(key) {
    return `<td style="${S.val};padding:0;width:1%">
      <input type="date" value="${d[key]||''}" onchange="d.${key}=this.value" style="width:100%;height:100%;min-width:118px;border:none;background:transparent;padding:9px 6px;font-size:10.5px;color:#111;cursor:pointer;outline:none;box-sizing:border-box;font-family:inherit">
    </td>`;
  }

  // خلية قائمة منسدلة؛ لو القيمة المحفوظة خارج القائمة تُضاف كخيار حتى لا تضيع
  function selCell(key, opts, cs) {
    const cur = d[key] || '';
    const all = cur && !opts.includes(cur) ? opts.concat([cur]) : opts;
    return `<td style="${S.val};padding:0"${cs ? ` colspan="${cs}"` : ''}>
      <select onchange="d.${key}=this.value" style="width:100%;border:none;background:transparent;padding:9px 10px;font-size:11.5px;color:#111;cursor:pointer;outline:none;font-family:inherit">
        <option value="" ${!cur?'selected':''}>Select..</option>
        ${all.map(o => `<option value="${o}" ${cur===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </td>`;
  }

  function sigCell(key) {
    const img = d[key];
    return `<td style="padding:0;width:14%">
      <label style="box-sizing:border-box;display:flex;align-items:center;justify-content:center;position:relative;width:100%;height:46px;background:#fff;border:1px solid #ccc;cursor:pointer;overflow:hidden">
        ${img
          ? `<img src="${img}" style="width:100%;height:100%;object-fit:contain;display:block">`
          : `<span style="display:flex;align-items:center;gap:4px;color:#94a3b8;font-size:9.5px;font-weight:700;white-space:nowrap">📁 Upload</span>`}
        <input type="file" accept="image/*" onchange="_onSigUpload(this,'${key}')" style="display:none">
        ${img ? `<button type="button" onclick="event.preventDefault();event.stopPropagation();_removeSig('${key}')" title="Remove signature" style="position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;border:none;background:rgba(220,38,38,0.85);color:#fff;font-size:10px;font-weight:900;cursor:pointer;line-height:1;padding:0">✕</button>` : ''}
      </label>
    </td>`;
  }

  function _toggleAsset(name) {
    const i = d.assetTypes.indexOf(name);
    if (i > -1) d.assetTypes.splice(i, 1); else d.assetTypes.push(name);
  }

  function assetRow(name) {
    const unit = name === 'Transformer' && d.cap ? (d.cap + 'KVA') : '';
    const checked = d.assetTypes.includes(name);
    return `<tr>
      <td style="${S.val};width:29%;padding:5px 10px;font-size:11px"><label style="cursor:pointer;display:flex;align-items:center;gap:8px"><input type="checkbox" ${checked?'checked':''} onclick="_toggleAsset('${name}')"> ${name}</label></td>
      <td style="${S.val};width:29%;padding:5px 10px;font-size:11px" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${unit}</td>
    </tr>`;
  }

  function reportFormHtml(d) {
    const assetRows = ['Transformer','RMU','HFU','OLU','FP','MFP','SMFP','Cable'].map(assetRow).join('');
    const mapBlock = `
      <label style="display:block;position:relative;width:100%;height:260px;border:1px dashed #ccc;border-radius:6px;margin-top:6px;background:#fafafa;overflow:hidden;cursor:pointer">
        ${d.gisImage
          ? `<img src="${d.gisImage}" style="width:100%;height:100%;object-fit:cover;display:block">`
          : `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:6px">
               <div style="font-size:28px">📷</div>
               <div style="font-size:0.85rem;font-weight:700">Upload GIS Image</div>
             </div>`}
        ${d.gisImage ? `<div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700">📁 Replace Image</div>` : ''}
        ${d.gisImage ? `<button type="button" onclick="event.preventDefault();event.stopPropagation();_removeGisImage()" title="Remove image" style="position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(220,38,38,0.9);color:#fff;font-size:14px;font-weight:900;cursor:pointer;line-height:1">✕</button>` : ''}
        <input type="file" accept="image/*" onchange="_onGisUpload(this)" style="display:none">
      </label>`;
    return `<div class="a4-page">
  <div style="display:flex;align-items:stretch;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.1)">
    <img src="nama.png" style="height:64px;padding:10px 22px;background:#fff">
    <div style="flex:1;background:#e8333a;color:#fff;font-weight:800;font-size:17px;padding:14px 20px;display:flex;align-items:center;justify-content:center;text-align:center">ENHANCEMENT PRE-INVESTMENT PROJECT APPRAISAL</div>
  </div>
  <div style="${S.hdr}">PROJECT DETAILS</div>
  <table style="${S.tbl}">
    <tr>${lbl('REF. NO:','white-space:nowrap')}${val(d.refNo,5,'refNo')}</tr>
    <tr>${lbl('Project Description','white-space:nowrap')}${selCell('projDesc', PROJ_DESCS, 5)}</tr>
    <tr>${lbl('Area','white-space:nowrap')}${val(d.station,5,'station')}</tr>
    <tr>${lbl('District','white-space:nowrap')}${val(d.district,5,'district')}</tr>
    <tr>${lbl('Requesting Department','white-space:nowrap')}${val(d.reqDept,5,'reqDept')}</tr>
  </table>
  <div style="${S.hdr}">TRANSFORMER DETAILS</div>
  <table style="${S.tbl}">
    <tr>${lbl('TX. NO.','white-space:nowrap')}${cval(d.txNo,'txNo')}${lbl('Capacity','white-space:nowrap')}${cval(d.cap,'cap')}${lbl('NO of Complaints','white-space:nowrap')}${cval(d.complaints,'complaints')}</tr>
  </table>
  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
  <table style="${S.tbl};min-width:560px">
    <tr>
      <td style="${S.lbl}" rowspan="2">Voltage Reading</td>
      ${colh('R-N')}${colh('Y-N')}${colh('B-N')}${colh('R-Y')}${colh('R-B')}${colh('Y-B')}
    </tr>
    <tr>${cval(d.vRN,'vRN')}${cval(d.vYN,'vYN')}${cval(d.vBN,'vBN')}${cval(d.vRY,'vRY')}${cval(d.vRB,'vRB')}${cval(d.vYB,'vYB')}</tr>
  </table>
  </div>
  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
  <table style="${S.tbl};min-width:560px">
    <tr><td style="${S.grp}" colspan="4">TX. Load</td><td style="${S.grp}" colspan="4">Feeder Load${d.fNum ? ` <span style="font-weight:800">(F${d.fNum})</span>` : ''}</td></tr>
    <tr>${colh('R')}${colh('Y')}${colh('B')}${colh('N')}${colh('R')}${colh('Y')}${colh('B')}${colh('N')}</tr>
    <tr>${cval(d.tR,'tR')}${cval(d.tY,'tY')}${cval(d.tB,'tB')}${cval(d.tN,'tN')}${cval(d.fR,'fR')}${cval(d.fY,'fY')}${cval(d.fB,'fB')}${cval(d.fN,'fN')}</tr>
  </table>
  </div>
  <table style="${S.tbl}">
    <tr>
      <td style="${S.grp};width:50%">TX. Load &nbsp; <span data-key="txPct" style="display:inline-block;min-width:42px;background:#e7ecf7;padding:2px 8px;border-radius:3px;cursor:pointer" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.txPct}</span> &nbsp; %</td>
      <td style="${S.grp};width:50%">Feeder Load${d.fNum ? ` (F${d.fNum})` : ''} &nbsp; <span data-key="fPct" style="display:inline-block;min-width:42px;background:#e7ecf7;padding:2px 8px;border-radius:3px;cursor:pointer" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.fPct}</span> &nbsp; %</td>
    </tr>
  </table>
  <table style="${S.tbl};table-layout:fixed">
    <tr>
      <td style="${S.lbl};width:30%;font-size:10.5px">Main cable/conductor size</td>
      <td style="${S.val};width:20%;font-size:10.5px" data-key="cableSize" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.cableSize||''}</td>
      <td style="${S.lbl};width:30%;font-size:10.5px">Connection point from the TX to the affected customer (m)</td>
      <td style="${S.val};width:20%;font-size:10.5px" data-key="connPoint" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.connPoint||''}</td>
    </tr>
  </table>
  <div style="${S.hdr}">PROJECT DESCRIPTION OPTION</div>
  <table style="${S.tbl}">
    <tr>${lbl('Option 1','white-space:nowrap')}${val(d.opt1,0,'opt1')}${lbl('Cost estimated','white-space:nowrap')}${val(d.opt1Cost,0,'opt1Cost')}</tr>
    <tr>${lbl('Option 2','white-space:nowrap')}${val(d.opt2,0,'opt2')}${lbl('Cost estimated','white-space:nowrap')}${val(d.opt2Cost,0,'opt2Cost')}</tr>
  </table>
  <div style="${S.hdr}">PROJECT REASON</div>
  <table style="${S.tbl}"><tr><td style="${S.val}" data-key="reason" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.reason}</td></tr></table>
  <div style="${S.hdr}">RISK OF NOT EXECUTING PROPOSAL</div>
  <table style="${S.tbl}"><tr><td style="${S.val}" data-key="risk" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.risk}</td></tr></table>
  </div>

  <div class="a4-page page-break">
    <div style="display:flex;align-items:stretch;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.1)">
      <img src="nama.png" style="height:64px;padding:10px 22px;background:#fff">
      <div style="flex:1;background:#e8333a;color:#fff;font-weight:800;font-size:17px;padding:14px 20px;display:flex;align-items:center;justify-content:center;text-align:center">ENHANCEMENT PRE-INVESTMENT PROJECT APPRAISAL</div>
    </div>

    <div style="${S.hdr};margin-top:18px">NETWORK OVERVIEW (GIS)</div>
    ${mapBlock}

    <table style="${S.tbl}">
      <tr>
        <td style="${S.lbl};width:42%;padding:6px 10px;font-size:11px">Free Spare Available for New Proposed FD</td>
        <td style="${S.val};padding:6px 10px" colspan="3">
          <label style="margin-inline-end:24px;cursor:pointer"><input type="radio" name="freeSpare" ${d.freeSpare==='yes'?'checked':''} onclick="d.freeSpare='yes'"> Yes</label>
          <label style="cursor:pointer"><input type="radio" name="freeSpare" ${d.freeSpare==='no'?'checked':''} onclick="d.freeSpare='no'"> No</label>
        </td>
      </tr>
    </table>

    <table style="${S.tbl}">
      <tr>
        <td style="${S.lbl};width:42%;padding:6px 10px;font-size:11px" rowspan="9">List of additional required Asset</td>
        <td style="${S.grp};width:29%;padding:5px 10px;font-size:10.5px">Asset</td>
        <td style="${S.grp};width:29%;padding:5px 10px;font-size:10.5px">Unit (No./meters)</td>
      </tr>
      ${assetRows}
    </table>

    <div style="${S.hdr}">RECOMMENDATIONS</div>
    <table style="${S.tbl}"><tr><td style="${S.val};padding:0">
      <select onchange="d.recommendation=this.value" style="width:100%;border:none;background:transparent;padding:9px 10px;font-size:11.5px;color:#111;cursor:pointer;outline:none">
        <option value="" ${!d.recommendation?'selected':''}>Select..</option>
        ${RECS.map(r => `<option value="${r}" ${d.recommendation===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </td></tr></table>

    <div style="${S.hdr}">AUTHORIZATION APPROVAL</div>
    <table style="${S.tbl}">
      <tr><td style="${S.colh};width:22%;white-space:nowrap">Position</td>${colh('Name')}${colh('Signature')}<td style="${S.colh};width:1%;white-space:nowrap">Date</td></tr>
      <tr><td style="${S.lbl};white-space:nowrap">Operation Engineer</td>${val(d.engName,0,'engName')}${sigCell('engSig')}${dateCell('engDate')}</tr>
      <tr><td style="${S.lbl};white-space:nowrap">Operation Section Head</td>${val(d.secName,0,'secName')}${sigCell('secSig')}${dateCell('secDate')}</tr>
      <tr><td style="${S.lbl};white-space:nowrap">Operation Manger</td>${val(d.mgrName,0,'mgrName')}${sigCell('mgrSig')}${dateCell('mgrDate')}</tr>
    </table>
  </div>`;
  }

  // ── Round selector + render ──────────────────────────────────────────
  function renderRound(i) {
    if (!_payload || !_payload.rounds || !_payload.rounds[i]) return;
    Object.assign(d, _payload.rounds[i]);
    d.station = _payload.station || d.station;
    d.txNo = _payload.txNo || d.txNo;
    d.cap = _payload.cap || d.cap;
    d.lat = _payload.lat || d.lat;
    d.lng = _payload.lng || d.lng;
    d.txPct = _pct(d.cap, Math.max(Number(d.tR)||0, Number(d.tY)||0, Number(d.tB)||0));
    d.fPct = _pctCable(d.fAmp, Math.max(Number(d.fR)||0, Number(d.fY)||0, Number(d.fB)||0));
    // حجم الكيبل الرئيسي يُعبّأ تلقائياً من كيبل الفيدر — بدون المساس بما كتبه المستخدم
    if (d.fSize && !d.cableSize) d.cableSize = d.fSize + ' mm²';
    document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
  }

  function selectRound(i) {
    document.querySelectorAll('#roundSelWrap button').forEach((b, bi) => {
      b.style.background = bi === i ? '#2563eb' : '#efefef';
      b.style.color = bi === i ? '#fff' : '#111';
    });
    renderRound(i);
  }

  if (_payload && _payload.rounds && _payload.rounds.length) {
    if (_payload.station) d.station = _payload.station;
    if (_payload.txNo) d.txNo = _payload.txNo;
    if (_payload.cap) d.cap = _payload.cap;
    // الجولة الافتراضية: الجولة الأعلى حملاً كما حسبها التطبيق (وليس دائماً الجولة الأولى)
    const _start = Number(_payload.bestRound) || 0;
    if (_payload.rounds.length > 1) {
      document.getElementById('roundSelWrap').innerHTML =
        '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.8rem">' +
        _payload.rounds.map((r, i) =>
          `<button onclick="selectRound(${i})" style="padding:0.4rem 0.9rem;border-radius:8px;border:1px solid #cbd5e1;background:${i===_start?'#2563eb':'#efefef'};color:${i===_start?'#fff':'#111'};cursor:pointer;font-size:0.85rem;font-weight:700">${r.label}</button>`
        ).join('') + '</div>';
    }
    renderRound(_start);
  } else {
    document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
  }

  // ── Load the last saved proposal text for this transformer (if any) so
  // reopening the form later restores what was typed, not just live readings ─
  async function _loadSavedProposal() {
    if (!d.txNo) return;
    const SUPA_URL = 'https://hgnufhugpqqbkbxflyot.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnVmaHVncHFxYmtieGZseW90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTc4NTgsImV4cCI6MjA5MjUzMzg1OH0.ElSIjFOg82EuNgdfCL3RtQDUhEXHqjjz7BwC4G7IAyA';
    try {

  function _removeSig(key) {
    d[key] = null;
    document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
  }
  function _onSigUpload(input, key) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = data.data;
        for (let i = 0; i < px.length; i += 4) {
          const r = px[i], g = px[i+1], b = px[i+2];
          const brightness = (r + g + b) / 3;
          if (brightness > 235) px[i+3] = 0;
          else if (brightness > 190) px[i+3] = Math.round(255 * (235 - brightness) / 45);
        }
        ctx.putImageData(data, 0, 0);
        d[key] = canvas.toDataURL('image/png');
        document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function _removeGisImage() {
    d.gisImage = null;
    document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
  }
  function _onGisUpload(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      d.gisImage = reader.result;
      document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
    };
    reader.readAsDataURL(file);
  }

  // ── Respond to toolbar commands sent from the parent window (postMessage avoids
  // cross-origin issues when this file is opened via file:// as a separate iframe src) ─
  window.addEventListener('message', e => {
    const action = e.data && e.data.action;
    if (action === 'print') window.print();
    else if (action === 'exportWord') _exportWord();
    else if (action === 'save') _saveProposal();
  });

  // ── Sync manual edits in contenteditable cells back into `d` ─────────
  document.getElementById('proposalForm').addEventListener('focusout', e => {
    const el = e.target.closest('[data-key]');
    if (el && el.isContentEditable) d[el.dataset.key] = el.textContent.trim();
  });

  // ── Toast ──────────────────────────────────────────────────────────
  function _toast(msg, isErr) {
    const t = document.getElementById('_toast');
    t.textContent = msg;
    t.className = isErr ? 'show err' : 'show';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = ''; }, 3500);
  }

  // ── Export as Word (.doc) ─────────────────────────────────────────────
  function _exportWord() {
    const form = document.getElementById('proposalForm').cloneNode(true);
    form.querySelectorAll('select').forEach(s => {
      [...s.options].forEach(o => o.toggleAttribute('selected', o.selected));
    });
    form.querySelectorAll('input[type="date"]').forEach(i => i.setAttribute('value', i.value));
    form.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(i => i.toggleAttribute('checked', i.checked));
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="utf-8"><title>Proposal</title></head>
      <body>${form.innerHTML}</body></html>`;
    const blob = new Blob(['﻿', html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Proposal_${d.txNo || 'form'}.doc`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ── Click-to-copy helpers ───────────────────────────────────────────
  function _fallbackCopy(txt, done) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); if (done) done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  function _copyText(txt) {
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).catch(() => _fallbackCopy(txt));
    } else _fallbackCopy(txt);
  }
  function _copyCell(el) {
    const t = (el.textContent || '').trim();
    if (t) _copyText(t);
  }

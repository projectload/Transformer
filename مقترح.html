<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal Form</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#f4f6fb; margin:0; padding:24px; }
  .tip { font-size:0.8rem; color:#666; margin-bottom:0.6rem; }
  .page-break { margin-top:34px; padding-top:26px; border-top:8px solid #d8dce3; }
  @media print { .page-break { break-before:page; page-break-before:always; border-top:none; margin-top:0; padding-top:0; } }
</style>
</head>
<body>

<div class="tip">💡 Click any value cell to copy it, then paste it wherever you need.</div>

<div id="roundSelWrap" style="max-width:920px;margin:0 auto"></div>
<div id="proposalForm" style="max-width:920px;margin:0 auto 1.5rem"></div>

<script>
  // ── Style tokens (match the original report look) ──────────────────
  const S = {
    hdr:  'background:#e8333a;color:#fff;font-weight:800;padding:8px 12px;font-size:13px;margin-top:14px;border-radius:3px',
    tbl:  'width:100%;border-collapse:separate;border-spacing:4px;margin-top:4px',
    lbl:  'background:#efefef;color:#111;font-weight:700;font-size:11.5px;padding:9px 10px;width:1%',
    val:  'background:#e7ecf7;color:#111;padding:9px 10px;font-size:11.5px;cursor:pointer',
    colh: 'background:#efefef;color:#111;font-weight:700;text-align:center;font-size:11px;padding:7px',
    cval: 'background:#e7ecf7;color:#111;text-align:center;padding:9px;font-size:11.5px;cursor:pointer;min-width:42px',
    grp:  'background:#efefef;color:#111;font-weight:700;text-align:center;font-size:11.5px;padding:7px',
  };

  const tip  = 'click to copy';
  const lbl  = x        => `<td style="${S.lbl}">${x}</td>`;
  const colh = x        => `<td style="${S.colh}">${x}</td>`;
  // contenteditable="true" so the cell can be filled in directly on this standalone page
  const val  = (x, cs)  => `<td style="${S.val}"${cs ? ` colspan="${cs}"` : ''} contenteditable="true" onclick="_copyCell(this)" title="${tip}">${x || ''}</td>`;
  const cval = x         => `<td style="${S.cval}" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${x || ''}</td>`;

  // ── Fill this object with your data (or leave blank / edit inline) ─
  const d = {
    station: '',                 // Area
    txNo: '', cap: '', lat: null, lng: null,
    vRN:'', vYN:'', vBN:'', vRY:'', vRB:'', vYB:'',
    tR:'', tY:'', tB:'', tN:'', txPct:'',
    fR:'', fY:'', fB:'', fN:'', fPct:'',
    cableSize:'',
    opt1:'', opt2:'',
    reason:'', risk:'', gisImage:null,
    freeSpare:'', assetType:'Transformer', assetUnit:'',
    recommendation:'',
    engName:'', engDate:'', secName:'', secDate:'', mgrName:'', mgrDate:''
  };

  // ── Prefill from URL query params (e.g. ?station=...&txNo=...&cap=...&txPct=...) ─
  const _qs = new URLSearchParams(location.search);
  ['station','txNo','cap','txPct','fPct'].forEach(k => {
    const v = _qs.get(k);
    if (v) d[k] = v;
  });

  // ── Prefill from the app (sessionStorage payload: station/txNo/cap + per-round readings) ─
  let _payload = null;
  try {
    const raw = sessionStorage.getItem('proposalData');
    if (raw) _payload = JSON.parse(raw);
  } catch (e) {}

  function _pct(cap, cur) {
    const rated = cap ? (Number(cap) * 1000) / (Math.sqrt(3) * 415) : 0;
    if (!rated || !cur) return '';
    return String(Math.round((Number(cur) / rated) * 100));
  }

  function assetRow(name) {
    const unit = name === 'Transformer' && d.cap ? (d.cap + 'KVA') : '';
    return `<tr>
      <td style="${S.val};width:29%;padding:5px 10px;font-size:11px"><label style="cursor:pointer;display:flex;align-items:center;gap:8px"><input type="radio" name="assetType" ${d.assetType===name?'checked':''} onclick="d.assetType='${name}'"> ${name}</label></td>
      <td style="${S.val};width:29%;padding:5px 10px;font-size:11px" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${unit}</td>
    </tr>`;
  }

  function reportFormHtml(d) {
    const assetRows = ['Transformer','RMU','HFU','OLU','FP','MFP','SMFP','Cable'].map(assetRow).join('');
    const mapBlock = `
      <label style="display:block;position:relative;width:100%;height:260px;border:1px dashed #ccc;border-radius:6px;margin-top:6px;background:#fafafa;overflow:hidden;cursor:pointer">
        ${d.gisImage
          ? `<img src="${d.gisImage}" style="width:100%;height:100%;object-fit:cover;display:block">`
          : `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:6px">
               <div style="font-size:28px">📷</div>
               <div style="font-size:0.85rem;font-weight:700">Upload GIS Image</div>
             </div>`}
        ${d.gisImage ? `<div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700">📁 Replace Image</div>` : ''}
        ${d.gisImage ? `<button type="button" onclick="event.preventDefault();event.stopPropagation();_removeGisImage()" title="Remove image" style="position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(220,38,38,0.9);color:#fff;font-size:14px;font-weight:900;cursor:pointer;line-height:1">✕</button>` : ''}
        <input type="file" accept="image/*" onchange="_onGisUpload(this)" style="display:none">
      </label>`;
    return `<div style="${S.hdr}">PROJECT DETAILS</div>
  <table style="${S.tbl}">
    <tr>${lbl('REF. NO:')}${val('',5)}</tr>
    <tr>${lbl('Project Description')}${val('',5)}</tr>
    <tr>${lbl('Area')}${val(d.station,5)}</tr>
    <tr>${lbl('District')}${val('',5)}</tr>
    <tr>${lbl('Requesting Department')}${val('',5)}</tr>
  </table>
  <div style="${S.hdr}">TRANSFORMER DETAILS</div>
  <table style="${S.tbl}">
    <tr>${lbl('TX. NO.')}${cval(d.txNo)}${lbl('Capacity')}${cval(d.cap)}${lbl('NO of Complaints')}${cval('')}</tr>
  </table>
  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
  <table style="${S.tbl};min-width:560px">
    <tr>
      <td style="${S.lbl}" rowspan="2">Voltage Reading</td>
      ${colh('R-N')}${colh('Y-N')}${colh('B-N')}${colh('R-Y')}${colh('R-B')}${colh('Y-B')}
    </tr>
    <tr>${cval(d.vRN)}${cval(d.vYN)}${cval(d.vBN)}${cval(d.vRY)}${cval(d.vRB)}${cval(d.vYB)}</tr>
  </table>
  </div>
  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
  <table style="${S.tbl};min-width:560px">
    <tr><td style="${S.grp}" colspan="4">TX. Load</td><td style="${S.grp}" colspan="4">Feeder Load</td></tr>
    <tr>${colh('R')}${colh('Y')}${colh('B')}${colh('N')}${colh('R')}${colh('Y')}${colh('B')}${colh('N')}</tr>
    <tr>${cval(d.tR)}${cval(d.tY)}${cval(d.tB)}${cval(d.tN)}${cval(d.fR)}${cval(d.fY)}${cval(d.fB)}${cval(d.fN)}</tr>
  </table>
  </div>
  <table style="${S.tbl}">
    <tr>
      <td style="${S.grp};width:50%">TX. Load &nbsp; <span style="display:inline-block;min-width:42px;background:#e7ecf7;padding:2px 8px;border-radius:3px;cursor:pointer" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.txPct}</span> &nbsp; %</td>
      <td style="${S.grp};width:50%">Feeder Load &nbsp; <span style="display:inline-block;min-width:42px;background:#e7ecf7;padding:2px 8px;border-radius:3px;cursor:pointer" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.fPct}</span> &nbsp; %</td>
    </tr>
  </table>
  <table style="${S.tbl};table-layout:fixed">
    <tr>
      <td style="${S.lbl};width:30%;font-size:10.5px">Main cable/conductor size</td>
      <td style="${S.val};width:20%;font-size:10.5px" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.cableSize||''}</td>
      <td style="${S.lbl};width:30%;font-size:10.5px">Connection point from the TX to the affected customer (m)</td>
      <td style="${S.val};width:20%;font-size:10.5px" contenteditable="true" onclick="_copyCell(this)" title="${tip}"></td>
    </tr>
  </table>
  <div style="${S.hdr}">PROJECT DESCRIPTION OPTION</div>
  <table style="${S.tbl}">
    <tr>${lbl('Option 1')}${val(d.opt1)}${lbl('Cost estimated')}${val('')}</tr>
    <tr>${lbl('Option 2')}${val(d.opt2)}${lbl('Cost estimated')}${val('')}</tr>
  </table>
  <div style="${S.hdr}">PROJECT REASON</div>
  <table style="${S.tbl}"><tr><td style="${S.val}" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.reason}</td></tr></table>
  <div style="${S.hdr}">RISK OF NOT EXECUTING PROPOSAL</div>
  <table style="${S.tbl}"><tr><td style="${S.val}" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.risk}</td></tr></table>
  <hr style="margin:18px 0 10px;border:none;border-top:1px solid #ddd">
  <div style="display:flex;align-items:center;gap:12px;font-size:10px;color:#333;flex-wrap:wrap">
    <img src="nama.png" style="height:34px" alt="nama">
    <div>
      <div style="color:#e8333a;font-weight:700">www.distribution.nama.om &nbsp;|&nbsp; info@distribution.nama.om &nbsp;|&nbsp; +968 24588600</div>
      <div>Nama Electricity Distribution Company SAOC &nbsp;|&nbsp; PO Box 1721, PC 111, Sultanate of Oman &nbsp;|&nbsp; CR 1712390</div>
    </div>
  </div>

  <div class="page-break">
    <div style="display:flex;align-items:stretch;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.1)">
      <img src="nama.png" style="height:64px;padding:10px 22px;background:#fff">
      <div style="flex:1;background:#e8333a;color:#fff;font-weight:800;font-size:17px;padding:14px 20px;display:flex;align-items:center;justify-content:center;text-align:center">ENHANCEMENT PRE-INVESTMENT PROJECT APPRAISAL</div>
    </div>

    <div style="${S.hdr};margin-top:18px">NETWORK OVERVIEW (GIS)</div>
    ${mapBlock}

    <table style="${S.tbl}">
      <tr>
        <td style="${S.lbl};width:42%;padding:6px 10px;font-size:11px">Free Spare Available for New Proposed FD</td>
        <td style="${S.val};padding:6px 10px" colspan="3">
          <label style="margin-inline-end:24px;cursor:pointer"><input type="radio" name="freeSpare" ${d.freeSpare==='yes'?'checked':''} onclick="d.freeSpare='yes'"> Yes</label>
          <label style="cursor:pointer"><input type="radio" name="freeSpare" ${d.freeSpare==='no'?'checked':''} onclick="d.freeSpare='no'"> No</label>
        </td>
      </tr>
    </table>

    <table style="${S.tbl}">
      <tr>
        <td style="${S.lbl};width:42%;padding:6px 10px;font-size:11px" rowspan="9">List of additional required Asset</td>
        <td style="${S.grp};width:29%;padding:5px 10px;font-size:10.5px">Asset</td>
        <td style="${S.grp};width:29%;padding:5px 10px;font-size:10.5px">Unit (No./meters)</td>
      </tr>
      ${assetRows}
    </table>

    <div style="${S.hdr}">RECOMMENDATIONS</div>
    <table style="${S.tbl}"><tr><td style="${S.val}" contenteditable="true" onclick="_copyCell(this)" title="${tip}">${d.recommendation}</td></tr></table>

    <div style="${S.hdr}">AUTHORIZATION APPROVAL</div>
    <table style="${S.tbl}">
      <tr>${colh('Position')}${colh('Name')}${colh('Signature')}${colh('Date')}</tr>
      <tr>${lbl('Operation Engineer')}${val(d.engName)}<td style="background:#fff;border:1px solid #ccc"></td>${val(d.engDate)}</tr>
      <tr>${lbl('Operation Section Head')}${val(d.secName)}<td style="background:#fff;border:1px solid #ccc"></td>${val(d.secDate)}</tr>
      <tr>${lbl('Operation Manger')}${val(d.mgrName)}<td style="background:#fff;border:1px solid #ccc"></td>${val(d.mgrDate)}</tr>
    </table>
  </div>`;
  }

  // ── Round selector + render ──────────────────────────────────────────
  function renderRound(i) {
    if (!_payload || !_payload.rounds || !_payload.rounds[i]) return;
    Object.assign(d, _payload.rounds[i]);
    d.station = _payload.station || d.station;
    d.txNo = _payload.txNo || d.txNo;
    d.cap = _payload.cap || d.cap;
    d.lat = _payload.lat || d.lat;
    d.lng = _payload.lng || d.lng;
    d.txPct = _pct(d.cap, Math.max(Number(d.tR)||0, Number(d.tY)||0, Number(d.tB)||0));
    d.fPct = _pct(d.cap, Math.max(Number(d.fR)||0, Number(d.fY)||0, Number(d.fB)||0));
    document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
  }

  function selectRound(i) {
    document.querySelectorAll('#roundSelWrap button').forEach((b, bi) => {
      b.style.background = bi === i ? '#2563eb' : '#efefef';
      b.style.color = bi === i ? '#fff' : '#111';
    });
    renderRound(i);
  }

  if (_payload && _payload.rounds && _payload.rounds.length) {
    if (_payload.station) d.station = _payload.station;
    if (_payload.txNo) d.txNo = _payload.txNo;
    if (_payload.cap) d.cap = _payload.cap;
    if (_payload.rounds.length > 1) {
      document.getElementById('roundSelWrap').innerHTML =
        '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.8rem">' +
        _payload.rounds.map((r, i) =>
          `<button onclick="selectRound(${i})" style="padding:0.4rem 0.9rem;border-radius:8px;border:1px solid #cbd5e1;background:${i===0?'#2563eb':'#efefef'};color:${i===0?'#fff':'#111'};cursor:pointer;font-size:0.85rem;font-weight:700">${r.label}</button>`
        ).join('') + '</div>';
    }
    renderRound(0);
  } else {
    document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
  }

  function _removeGisImage() {
    d.gisImage = null;
    document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
  }
  function _onGisUpload(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      d.gisImage = reader.result;
      document.getElementById('proposalForm').innerHTML = reportFormHtml(d);
    };
    reader.readAsDataURL(file);
  }

  // ── Click-to-copy helpers ───────────────────────────────────────────
  function _fallbackCopy(txt, done) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); if (done) done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  function _copyText(txt) {
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).catch(() => _fallbackCopy(txt));
    } else _fallbackCopy(txt);
  }
  function _copyCell(el) {
    const t = (el.textContent || '').trim();
    if (t) _copyText(t);
  }
</script>
</body>
</html>
